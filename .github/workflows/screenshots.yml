name: Application screenshots
on:
  workflow_dispatch:
  push:
    branches: [docs/public-presentation]
    paths: [.github/workflows/screenshots.yml]
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build released UI
        run: |
          cmake -S . -B build-qt -G "Visual Studio 17 2022" -A x64 -DMOEX_BUILD_QT=ON
          cmake --build build-qt --config Release --parallel 2
      - name: Capture real application with synthetic demo data
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          . ./.github/scripts/qt-package.ps1
          Deploy-QtPackage -SourceDir (Get-Location).Path -BuildDir (Join-Path (Get-Location) 'build-qt') -PackageDir (Join-Path (Get-Location) 'screenshots-package')
          New-Item -ItemType Directory -Force docs/screenshots | Out-Null
          $exe = Join-Path (Get-Location) 'screenshots-package/MOEXWatch-Qt.exe'
          foreach ($item in @(@('overview',0), @('signals',2), @('portfolio',8), @('strategy',7))) {
            $out = Join-Path (Get-Location) "docs/screenshots/$($item[0]).png"
            $p = Start-Process -FilePath $exe -ArgumentList @('--demo','--page',"$($item[1])",'--screenshot', $out) -Wait -PassThru
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "Screenshot failed: $($item[0])" }
          }
          $out = Join-Path (Get-Location) 'docs/screenshots/portfolio-light.png'
          $p = Start-Process -FilePath $exe -ArgumentList @('--demo','--portfolio','--light','--screenshot',$out) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw 'Light screenshot failed' }
      - name: Save reproducible screenshots
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'docs: capture actual Qt application with synthetic demo data'
            git push origin HEAD:${{ github.ref_name }}
            if ($LASTEXITCODE -ne 0) { throw 'Screenshot push failed' }
          }
