name: Qt Quick preview
on:
  push:
    branches: ["main", "feature/qt-quick-portfolio"]
  pull_request:
    branches: ["main"]
    paths: ["qt/**", "CMakeLists.txt", ".github/workflows/qt-preview.yml", "build_qt_windows.ps1", ".github/scripts/qt-package.ps1"]
permissions:
  contents: read

jobs:
  windows-qt:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Configure Qt application and regression tests
        run: cmake -S . -B build-qt -G "Visual Studio 17 2022" -A x64 -DMOEX_BUILD_QT=ON
      - name: Verify screenshot build target without capturing images
        run: cmake --build build-qt --config Release --target moexwatch_quick --parallel 2
      - name: Build
        run: cmake --build build-qt --config Release --parallel 2
      - name: Test existing core and Qt transitions
        run: ctest --test-dir build-qt -C Release --output-on-failure
      - name: Deploy, archive and verify extracted application
        shell: pwsh
        run: |
          . ./.github/scripts/qt-package.ps1
          $source = (Get-Location).Path
          $package = Join-Path $source 'qt-preview'
          # Simulate a reused preview folder from an older release.
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Set-Content (Join-Path $package 'MOEXWatch-Classic.exe') 'obsolete executable fixture'
          Deploy-QtPackage -SourceDir $source -BuildDir (Join-Path $source 'build-qt') -PackageDir $package
          Test-QtPackage -PackageDir $package -LogPrefix (Join-Path $source 'deployed')
          Compress-Archive qt-preview/* MOEXWatch-Qt-preview-Windows-x64.zip
          git archive --format=zip --output=MOEXWatch-Qt-preview-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed' }
          Expand-Archive MOEXWatch-Qt-preview-Windows-x64.zip extracted
          Test-QtPackage -PackageDir (Join-Path $source 'extracted') -LogPrefix (Join-Path $source 'extracted-smoke')
          Get-FileHash MOEXWatch-Qt-preview-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MOEXWatch-Qt-preview-${{ github.sha }}
          path: |
            MOEXWatch-Qt-preview-*.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
