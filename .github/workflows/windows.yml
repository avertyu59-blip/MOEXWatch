name: Windows build and tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  portable-calculations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure calculations without UI or adapters
        run: cmake -S . -B domain-build -DMOEX_DOMAIN_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build calculations
        run: cmake --build domain-build --parallel 2
      - name: Test calculations
        run: ctest --test-dir domain-build --output-on-failure

      - name: Configure journal migration checks
        run: cmake -S . -B migration-build -DCMAKE_BUILD_TYPE=Release
      - name: Build journal migration tests
        run: cmake --build migration-build --target portfolio_identity_tests io_runtime_tests storage_integration_tests storage_tests app_storage_tests --parallel 2
      - name: Check journal identity and migration
        run: ctest --test-dir migration-build -R "portfolio_identity_tests|io_runtime_tests|storage_integration_tests|storage_tests|app_storage_tests" --output-on-failure
