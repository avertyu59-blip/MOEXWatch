name: Publish versioned Windows releases

on:
  push:
    branches: ["main"]
    tags: ["v[0-9]*"]
    paths:
      - "VERSION.txt"
      - "CMakeLists.txt"
      - "src/**"
      - "include/**"
      - "tests/**"
      - "qt/**"
      - "docs/**"
      - ".github/workflows/releases.yml"
      - ".github/scripts/publish-releases.ps1"
      - ".github/scripts/qt-package.ps1"
      - ".github/release-history.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moexwatch-releases
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Find versions without published releases
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = fs.readFileSync('VERSION.txt', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid VERSION.txt');
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/v${version}`)
              throw new Error('Tag and VERSION.txt differ');
            const candidates = [{version, commit: context.sha}];
            const published = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const pending = candidates.filter(entry => !published.some(release => release.tag_name === `v${entry.version}` && !release.draft));
            pending.sort((a,b) => {
              const av=a.version.split('.').map(Number), bv=b.version.split('.').map(Number);
              return av[0]-bv[0] || av[1]-bv[1] || av[2]-bv[2];
            });
            core.setOutput('releases', JSON.stringify(pending));
            core.setOutput('publish', String(pending.length > 0));
            core.info(`Versions to publish: ${pending.map(entry => entry.version).join(', ') || 'none'}`);

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Build, test, package and publish each missing version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ needs.plan.outputs.releases }}
        run: ./.github/scripts/publish-releases.ps1

